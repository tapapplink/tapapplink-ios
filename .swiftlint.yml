# Minimal SwiftLint config tuned to the current TapAppLink sources.
included:
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm

disabled_rules:
  - todo

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3

reporter: "xcode"

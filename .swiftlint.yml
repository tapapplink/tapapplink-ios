# Minimal SwiftLint config tuned to the current TapAppLink sources.
included:
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm

disabled_rules:
  - todo
  # Current sources use trailing commas in multi-line literals.
  - trailing_comma

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3

# The public TapAppLink facade keeps configure/track/persist/log in one type.
type_body_length:
  warning: 500
  error: 550

file_length:
  warning: 550
  error: 600

reporter: "xcode"
